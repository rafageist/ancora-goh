#Ancora GOH configuration file
#Security's configuration
#
# Event authorization (enforced by control/Application.php since #14):
#   event_permissions[<event>] = array('<permiso>', ...)
# <event> is the handler name without the "app_event_" prefix. A user may
# run the event only if their roles hold ALL listed permissions
# (seguridad.permiso). An empty array() allows any authenticated user.
# Users holding the permission 'todos' (seeded for the 'superusuario' role)
# may run every event. Events NOT listed here are denied to everyone else
# (deny by default). The anonymous allowlist is Application::$anonymous_events.
# Values must be PHP literals; they are parsed, not executed.
#
# #14: the two historical entries were named get_form_editEspecialidad and
# get_form_editPlanificacion, which match no handler; they now use the
# handler names the client calls (www/js/app/client/forms/).

event_permissions[get_form_edit_Especialidad] = array('planificar', 'organizar_estudiantes', 'editar_especialidad')
event_permissions[get_form_edit_Planificacion] = array('planificar', 'configurar_tiempo', 'editar_planificacion')
