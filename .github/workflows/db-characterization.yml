# Characterization / regression suite of the historical database logic (issue #10).
# Synthetic fixtures only, in a socket-only throwaway cluster created by the job.
name: PostgreSQL characterization

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  characterize:
    name: MPI / Prioriza / constraints characterization (PostgreSQL 16)
    runs-on: ubuntu-24.04
    env:
      PG_BINDIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: PostgreSQL 16 server binaries
        run: |
          if [ ! -x "$PG_BINDIR/initdb" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-16
          fi
          sudo systemctl stop postgresql || true

      - name: Run suite (fails on FAIL, XPASS or XWRONG)
        timeout-minutes: 15
        run: dev/sql/tools/with-ephemeral-pg.sh dev/sql/tests/run.sh
