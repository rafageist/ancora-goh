# Drupal 11 foundation (issue #69): Composer validation and audit, coding
# standards, install from scratch from config/sync into a disposable
# socket-only PostgreSQL cluster, PHPUnit Kernel and Functional tests and an
# HTTP smoke test on 127.0.0.1. PHP 8.4 (local development) and 8.5 (the target
# host) against PostgreSQL 16 (local development) and 18 (the target host).
# The multisite job (#72) runs the organization sites behind the real stack,
# Caddy and PHP-FPM, on 127.0.0.1. The journey job runs the R1 scheduling
# journey on the same stack: request over HTTP, sync into the site's engine
# database, worker, timetable page and isolation between two sites. The parity
# job enters the same scenarios through the legacy application and through
# Drupal and compares the legacy tables and the generar() outcome (#70).
# The tenant job provisions single-database tenants with a non-superuser
# operator, runs their workers and checks isolation and recovery (#96).
name: Drupal foundation (modern/)

on:
  push:
    paths:
      - 'modern/**'
      # The parity job drives the legacy application.
      - 'control/**'
      - 'model/**'
      - 'lib/**'
      - 'view/**'
      - 'www/**'
      - 'bin/**'
      - '.github/workflows/modern.yml'
      - 'dev/sql/tools/with-ephemeral-pg.sh'
      - 'dev/sql/tools/disposable-guard.sh'
      - 'dev/sql/**'
      - 'dev/workspace/**'
      - 'dev/e2e/expected-placements.md5'
  pull_request:
    paths:
      - 'modern/**'
      # The parity job drives the legacy application.
      - 'control/**'
      - 'model/**'
      - 'lib/**'
      - 'view/**'
      - 'www/**'
      - 'bin/**'
      - '.github/workflows/modern.yml'
      - 'dev/sql/tools/with-ephemeral-pg.sh'
      - 'dev/sql/tools/disposable-guard.sh'
      - 'dev/sql/**'
      - 'dev/workspace/**'
      - 'dev/e2e/expected-placements.md5'

permissions:
  contents: read

jobs:
  drupal:
    name: PHP ${{ matrix.php }} + PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['16', '18']
    env:
      PG_BINDIR: /usr/lib/postgresql/${{ matrix.postgres }}/bin
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, gd, mbstring, xml, curl, zip, opcache
          coverage: none
          tools: composer:v2

      - name: PostgreSQL ${{ matrix.postgres }} server binaries (PGDG when missing)
        working-directory: .
        run: |
          if [ ! -x "$PG_BINDIR/initdb" ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -q
            sudo apt-get install -y -q "postgresql-${{ matrix.postgres }}"
          fi
          # Only disposable clusters are used; stop any packaged server.
          sudo systemctl stop postgresql || true
          "$PG_BINDIR/postgres" --version

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('modern/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: composer validate --strict
        run: composer validate --strict

      - name: composer install (locked)
        run: composer install --no-interaction --no-progress

      - name: composer audit
        run: composer audit --locked

      - name: Install from config/sync, phpcs, PHPUnit and HTTP smoke test
        working-directory: .
        timeout-minutes: 20
        run: dev/sql/tools/with-ephemeral-pg.sh modern/scripts/install-disposable.sh --skip-composer

      - name: Browser output of failed Functional tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-output-php${{ matrix.php }}-pg${{ matrix.postgres }}
          path: modern/web/sites/simpletest/browser_output
          if-no-files-found: ignore
          retention-days: 7

  multisite:
    name: Multisite (Caddy + PHP-FPM) PHP ${{ matrix.php }} + PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            postgres: '16'
          - php: '8.5'
            postgres: '18'
    env:
      PG_BINDIR: /usr/lib/postgresql/${{ matrix.postgres }}/bin
      CADDY_VERSION: 2.11.7
      # SHA-512 of caddy_2.11.7_linux_amd64.tar.gz from the release's
      # caddy_2.11.7_checksums.txt (verified when this pin was set).
      CADDY_SHA512: a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, gd, mbstring, xml, curl, zip, opcache
          coverage: none
          tools: composer:v2

      - name: PHP-FPM ${{ matrix.php }}
        working-directory: .
        run: |
          if ! command -v "php-fpm${{ matrix.php }}" >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q "php${{ matrix.php }}-fpm"
          fi
          # Only the verification's own pool runs; stop any packaged service.
          sudo systemctl stop "php${{ matrix.php }}-fpm" 2>/dev/null || true
          "php-fpm${{ matrix.php }}" -v
          echo "PHP_FPM=php-fpm${{ matrix.php }}" >> "$GITHUB_ENV"

      - name: Caddy ${{ env.CADDY_VERSION }} (official static build, pinned checksum)
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          curl -fsSL -o "$RUNNER_TEMP/caddy/caddy.tar.gz" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "${CADDY_SHA512}  $RUNNER_TEMP/caddy/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy/caddy.tar.gz" -C "$RUNNER_TEMP/caddy" caddy
          "$RUNNER_TEMP/caddy/caddy" version
          echo "CADDY=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"

      - name: PostgreSQL ${{ matrix.postgres }} server binaries (PGDG when missing)
        working-directory: .
        run: |
          if [ ! -x "$PG_BINDIR/initdb" ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -q
            sudo apt-get install -y -q "postgresql-${{ matrix.postgres }}"
          fi
          sudo systemctl stop postgresql || true
          "$PG_BINDIR/postgres" --version

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('modern/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: composer install (locked)
        run: composer install --no-interaction --no-progress

      - name: Multisite verification (control site, alpha, beta)
        working-directory: .
        timeout-minutes: 20
        run: dev/sql/tools/with-ephemeral-pg.sh modern/scripts/multisite-verify.sh --skip-composer

  journey:
    name: R1 scheduling journey (Caddy + PHP-FPM) PHP ${{ matrix.php }} + PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            postgres: '16'
          - php: '8.5'
            postgres: '18'
    env:
      PG_BINDIR: /usr/lib/postgresql/${{ matrix.postgres }}/bin
      CADDY_VERSION: 2.11.7
      # SHA-512 of caddy_2.11.7_linux_amd64.tar.gz from the release's
      # caddy_2.11.7_checksums.txt (verified when this pin was set).
      CADDY_SHA512: a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, gd, mbstring, xml, curl, zip, opcache
          coverage: none
          tools: composer:v2

      - name: PHP-FPM ${{ matrix.php }}
        working-directory: .
        run: |
          if ! command -v "php-fpm${{ matrix.php }}" >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q "php${{ matrix.php }}-fpm"
          fi
          # Only the verification's own pool runs; stop any packaged service.
          sudo systemctl stop "php${{ matrix.php }}-fpm" 2>/dev/null || true
          "php-fpm${{ matrix.php }}" -v
          echo "PHP_FPM=php-fpm${{ matrix.php }}" >> "$GITHUB_ENV"

      - name: Caddy ${{ env.CADDY_VERSION }} (official static build, pinned checksum)
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          curl -fsSL -o "$RUNNER_TEMP/caddy/caddy.tar.gz" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "${CADDY_SHA512}  $RUNNER_TEMP/caddy/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy/caddy.tar.gz" -C "$RUNNER_TEMP/caddy" caddy
          "$RUNNER_TEMP/caddy/caddy" version
          echo "CADDY=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"

      - name: PostgreSQL ${{ matrix.postgres }} server binaries (PGDG when missing)
        working-directory: .
        run: |
          if [ ! -x "$PG_BINDIR/initdb" ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -q
            sudo apt-get install -y -q "postgresql-${{ matrix.postgres }}"
          fi
          sudo systemctl stop postgresql || true
          "$PG_BINDIR/postgres" --version

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('modern/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: composer install (locked)
        run: composer install --no-interaction --no-progress

      - name: R1 journey (request over HTTP, sync, worker, timetable, isolation)
        working-directory: .
        timeout-minutes: 20
        run: dev/sql/tools/with-ephemeral-pg.sh modern/scripts/r1-journey.sh --skip-composer

  tenant:
    name: Single-database tenants (non-superuser operator) PHP ${{ matrix.php }} + PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            postgres: '16'
          - php: '8.5'
            postgres: '18'
    env:
      PG_BINDIR: /usr/lib/postgresql/${{ matrix.postgres }}/bin
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, gd, mbstring, xml, curl, zip, opcache
          coverage: none
          tools: composer:v2

      - name: PostgreSQL ${{ matrix.postgres }} server binaries (PGDG when missing)
        working-directory: .
        run: |
          if [ ! -x "$PG_BINDIR/initdb" ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -q
            sudo apt-get install -y -q "postgresql-${{ matrix.postgres }}"
          fi
          sudo systemctl stop postgresql || true
          "$PG_BINDIR/postgres" --version

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('modern/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: composer install (locked)
        run: composer install --no-interaction --no-progress

      - name: Tenant provisioning, isolation and recovery (single-database layout)
        working-directory: .
        timeout-minutes: 25
        run: dev/sql/tools/with-ephemeral-pg.sh modern/scripts/tenant-verify.sh --skip-composer

  parity:
    name: Legacy parity harness PHP ${{ matrix.php }} + PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            postgres: '16'
          - php: '8.5'
            postgres: '18'
    env:
      PG_BINDIR: /usr/lib/postgresql/${{ matrix.postgres }}/bin
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, gd, mbstring, xml, curl, zip, opcache
          coverage: none
          tools: composer:v2

      - name: PostgreSQL ${{ matrix.postgres }} server binaries (PGDG when missing)
        working-directory: .
        run: |
          if [ ! -x "$PG_BINDIR/initdb" ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            . /etc/os-release
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -q
            sudo apt-get install -y -q "postgresql-${{ matrix.postgres }}"
          fi
          sudo systemctl stop postgresql || true
          "$PG_BINDIR/postgres" --version

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('modern/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: composer install (locked)
        run: composer install --no-interaction --no-progress

      - name: Differential parity (legacy over HTTP vs Drupal + engine sync, and the single-database workspace path, every scenario)
        working-directory: .
        timeout-minutes: 20
        run: dev/sql/tools/with-ephemeral-pg.sh modern/scripts/parity-diff.sh --skip-composer --workspace

  artifact:
    name: Production build contents (no dev dependencies, no secrets)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, gd, mbstring, xml, curl, zip, opcache
          coverage: none
          tools: composer:v2

      - name: The repository tracks no generated, vendor or secret files
        run: |
          bad=$(git ls-files . | grep -E '^(vendor/|web/core/|web/modules/contrib/|web/themes/contrib/|web/libraries/|web/sites/[^/]+/files/|private/)|settings\.local\.php$|\.(sql|dump)(\.gz)?$' || true)
          if [ -n "$bad" ]; then echo "tracked files that must not be committed:"; echo "$bad"; exit 1; fi

      - name: composer install --no-dev
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader

      - name: No dev dependency in the build; audit of runtime packages
        run: |
          for p in phpunit/phpunit drupal/coder behat/mink; do
            if [ -e "vendor/$p" ]; then echo "dev dependency in the production build: $p"; exit 1; fi
          done
          composer audit --locked --no-dev
          php vendor/bin/drush --version
