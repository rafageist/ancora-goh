; PHP-FPM pool for the R0 portal (/etc/php/8.5/fpm/pool.d/timetables.conf).
; Separate user, socket, limits and secrets from the studio pool.
[timetables]
user = timetables
group = timetables
listen = /run/php/php8.5-fpm-timetables.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 15s
clear_env = yes
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 10
php_admin_value[post_max_size] = 32K
php_admin_flag[file_uploads] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/timetables/portal.log
php_admin_flag[expose_php] = off
php_admin_value[open_basedir] = /opt/divengine/timetables/portal:/etc/divengine/timetables:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
env[PORTAL_BASE_URL] = https://timetables.divengine.com
env[PORTAL_DB_DSN] = pgsql:host=127.0.0.1;port=5432;dbname=timetables_control
env[PORTAL_DB_USER] = tt_control_app
env[PORTAL_DB_PASSWORD_FILE] = /etc/divengine/timetables/db_password
env[PORTAL_SECRET_FILE] = /etc/divengine/timetables/hmac
env[PORTAL_MAIL_DRIVER] = postmark
env[PORTAL_POSTMARK_TOKEN_FILE] = /etc/divengine/timetables/postmark_token
env[PORTAL_MAIL_FROM] = SET_BY_MAINTAINER
env[PORTAL_CONTROLLER_NAME] = SET_BY_MAINTAINER
env[PORTAL_CONTACT_EMAIL] = SET_BY_MAINTAINER
