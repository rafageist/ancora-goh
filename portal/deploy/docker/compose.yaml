# Private staging of the R0 access-request portal. Loopback only; email goes to
# an outbox volume, never to real recipients. Not a public deployment.
#
#   portal/deploy/docker/stage.sh up | verify | down
name: timetables-portal-staging

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
    secrets: [pg_superuser]
    volumes: [pgdata:/var/lib/postgresql]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

  setup:
    profiles: [setup]
    image: postgres:18.6-trixie
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSFILE: /tmp/pgpass
    secrets: [pg_superuser, portal_db_password]
    volumes: [../../sql:/sql:ro, ./setup-db.sh:/setup-db.sh:ro]
    entrypoint: ["bash", "/setup-db.sh"]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]

  web:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      PORTAL_BASE_URL: "http://127.0.0.1:${PORTAL_HTTP_PORT:-8088}"
      PORTAL_COOKIE_SECURE: "0"
      PORTAL_DB_DSN: "pgsql:host=db;port=5432;dbname=timetables_control"
      PORTAL_DB_USER: tt_control_app
      PORTAL_DB_PASSWORD_FILE: /run/secrets/portal_db_password
      PORTAL_SECRET_FILE: /run/secrets/portal_hmac
      PORTAL_MAIL_DRIVER: outbox
      PORTAL_OUTBOX_DIR: /outbox
      PORTAL_CONTROLLER_NAME: "${PORTAL_CONTROLLER_NAME:-Staging controller (not for publication)}"
      PORTAL_CONTACT_EMAIL: "${PORTAL_CONTACT_EMAIL:-privacy@example.org}"
    secrets: [portal_db_password, portal_hmac]
    ports: ["127.0.0.1:${PORTAL_HTTP_PORT:-8088}:8080"]
    volumes: [outbox:/outbox]
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp, /run/apache2, /run/lock/apache2]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64

networks:
  backend: { internal: true }
  frontend: {}

volumes:
  pgdata: {}
  outbox: {}

secrets:
  pg_superuser: { file: "${PORTAL_SECRETS_DIR:-./secrets}/pg_superuser" }
  portal_db_password: { file: "${PORTAL_SECRETS_DIR:-./secrets}/portal_db_password" }
  portal_hmac: { file: "${PORTAL_SECRETS_DIR:-./secrets}/portal_hmac" }
