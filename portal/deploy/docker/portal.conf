<VirtualHost *:8080>
    DocumentRoot /srv/portal/public
    <Directory />
        Require all denied
        AllowOverride None
        Options None
    </Directory>
    <Directory /srv/portal/public>
        Require all granted
        AllowOverride None
        Options None
        # every path that is not a static asset goes to the front controller
        FallbackResource /index.php
    </Directory>
    LimitRequestBody 32768
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
