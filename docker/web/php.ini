; PHP settings for the Áncora GOH web container (#32).
; Errors go to the Apache error log (the container's stderr), never to the page.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off
date.timezone = UTC
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 2M
; Sessions live in /tmp (a tmpfs in compose.yaml): a restart logs users out.
session.save_path = /tmp
session.use_strict_mode = 1
