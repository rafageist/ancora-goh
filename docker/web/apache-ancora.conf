# Áncora GOH virtual host (#32). Only www/ is served; bin/, control/, lib/,
# model/ and view/ sit next to it and are reached by PHP includes only.
<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/ancora/www

    <Directory />
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/ancora/www>
        Options None
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Hidden files, configuration-like files, and helper scripts that are
    # included by index.php but are not pages.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(conf|ini|log|sql|tpl|bak|orig|sh)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^(path|test.*)\.(php|html)$">
        Require all denied
    </FilesMatch>

    # generar.php runs without a time limit; keep the connection open long
    # enough for a generation on a small dataset.
    Timeout 600

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
