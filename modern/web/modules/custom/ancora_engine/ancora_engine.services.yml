services:
  ancora_engine.settings:
    class: Drupal\ancora_engine\EngineSettings
    arguments: ['@settings']
  Drupal\ancora_engine\EngineSettings: '@ancora_engine.settings'

  ancora_engine.job_repository:
    class: Drupal\ancora_engine\JobRepository
    arguments: ['@database', '@datetime.time', '@uuid', '@cache_tags.invalidator']
  Drupal\ancora_engine\JobRepository: '@ancora_engine.job_repository'

  ancora_engine.engine_client:
    class: Drupal\ancora_engine\Engine\EngineClient
    arguments: ['@ancora_engine.settings']
  Drupal\ancora_engine\Engine\EngineClient: '@ancora_engine.engine_client'

  ancora_engine.worker:
    class: Drupal\ancora_engine\Worker
    arguments: ['@ancora_engine.job_repository', '@ancora_engine.engine_client', '@ancora_engine.settings', '@datetime.time', '@logger.channel.ancora_engine', '@?ancora_engine.job_input']
  Drupal\ancora_engine\Worker: '@ancora_engine.worker'

  logger.channel.ancora_engine:
    parent: logger.channel_base
    arguments: ['ancora_engine']
