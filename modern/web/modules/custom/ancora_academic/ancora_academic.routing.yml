ancora_academic.planning:
  path: '/ancora/planning'
  defaults:
    _controller: '\Drupal\ancora_academic\Controller\PlanningController::overview'
    _title: 'Planning'
  requirements:
    _permission: 'view academic data+administer academic data'

# The section pages of the planner navigation (#105).
ancora_academic.section.plans:
  path: '/ancora/planning/plans-periods'
  defaults:
    _controller: '\Drupal\ancora_academic\Controller\PlanningController::section'
    _title_callback: '\Drupal\ancora_academic\Controller\PlanningController::sectionTitle'
    section: plans
  requirements:
    _permission: 'view academic data+administer academic data'

ancora_academic.section.catalogues:
  path: '/ancora/planning/catalogues'
  defaults:
    _controller: '\Drupal\ancora_academic\Controller\PlanningController::section'
    _title_callback: '\Drupal\ancora_academic\Controller\PlanningController::sectionTitle'
    section: catalogues
  requirements:
    _permission: 'view academic data+administer academic data'

ancora_academic.section.assignments:
  path: '/ancora/planning/assignments-templates'
  defaults:
    _controller: '\Drupal\ancora_academic\Controller\PlanningController::section'
    _title_callback: '\Drupal\ancora_academic\Controller\PlanningController::sectionTitle'
    section: assignments
  requirements:
    _permission: 'view academic data+administer academic data'

# The day x slot restriction grid (D9a): ?period=, ?kind=, ?target=.
ancora_academic.restrictions:
  path: '/ancora/planning/restrictions'
  defaults:
    _form: '\Drupal\ancora_academic\Form\RestrictionGridForm'
    _title: 'Time restrictions'
  requirements:
    _permission: 'edit academic data+administer academic data'

# The other inputs of a period (D9b): ?period= (and ?activity_type=).
ancora_academic.period_inputs.breaks:
  path: '/ancora/planning/breaks'
  defaults:
    _form: '\Drupal\ancora_academic\Form\PeriodInputsForm'
    _title: 'Breaks'
    input: breaks
  requirements:
    _permission: 'edit academic data+administer academic data'

ancora_academic.period_inputs.zones:
  path: '/ancora/planning/priority-zones'
  defaults:
    _form: '\Drupal\ancora_academic\Form\PeriodInputsForm'
    _title: 'Priority zones'
    input: zones
  requirements:
    _permission: 'edit academic data+administer academic data'

ancora_academic.period_inputs.limits:
  path: '/ancora/planning/load-limits'
  defaults:
    _form: '\Drupal\ancora_academic\Form\PeriodInputsForm'
    _title: 'Daily load limits'
    input: limits
  requirements:
    _permission: 'edit academic data+administer academic data'
