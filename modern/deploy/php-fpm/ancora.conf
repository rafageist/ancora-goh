; PHP-FPM pool for the Áncora Drupal sites (issue #72), e.g.
; /etc/php/8.5/fpm/pool.d/ancora.conf. A template: nothing is deployed from
; this repository. Replace /srv/ancora (the checkout), /etc/ancora (settings
; and secrets) and /var/lib/ancora (files) with the host's paths.
;
; One pool serves the control site and every organization site. The pool
; carries only the values shared by all sites and the control site's own
; settings. Each organization's database, salt and files come from
; /etc/ancora/sites/<slug>/site.ini, which the settings read after Drupal has
; selected the site. The owner (schema) credentials are never readable by
; this pool: they are 0600 files for the operator's command line.
;
; The organization verification (modern/scripts/multisite-verify.sh) runs this
; file with only the user, socket, log and path lines replaced.
[ancora]
user = ancora
group = ancora
listen = /run/php/php8.5-fpm-ancora.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
request_terminate_timeout = 60s
clear_env = yes
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 30
php_admin_value[post_max_size] = 16M
php_admin_value[upload_max_filesize] = 8M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/ancora/php.log
php_admin_flag[expose_php] = off
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1
php_admin_value[open_basedir] = /srv/ancora/modern:/etc/ancora:/var/lib/ancora:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
; Shared by every site.
env[ANCORA_ENVIRONMENT] = production
env[ANCORA_DB_HOST] = /var/run/postgresql
env[ANCORA_DB_PORT] = 5432
env[ANCORA_TRUSTED_HOSTS] = SET_BY_MAINTAINER
env[ANCORA_SITES_DIR] = /etc/ancora/sites
; The control site (sites/default).
env[ANCORA_DB_NAME] = tt_control
env[ANCORA_DB_USER] = tt_control_app
env[ANCORA_DB_PASSWORD_FILE] = /etc/ancora/control/db-password
env[ANCORA_HASH_SALT_FILE] = /etc/ancora/control/hash-salt
env[ANCORA_PRIVATE_PATH] = /var/lib/ancora/control/private
env[ANCORA_TMP_PATH] = /var/lib/ancora/control/tmp
